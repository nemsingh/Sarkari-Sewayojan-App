name: Build Android Release Bundle (AAB & APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Build Android App Bundle (AAB)
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Build Universal Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: playstore-bundle-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload Test Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
